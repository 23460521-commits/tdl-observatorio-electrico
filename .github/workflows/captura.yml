name: Captura diaria

on:
  schedule:
    # 03:17 UTC = 21:17 hora del centro. Minuto 17 para evitar la congestion de la hora en punto.
    - cron: "17 3 * * *"
  workflow_dispatch: # permite correrla a mano desde la pestana Actions

permissions:
  contents: write # para subir los datos capturados al repositorio

concurrency:
  group: captura
  cancel-in-progress: false

jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TDL_CONTACTO: ${{ vars.TDL_CONTACTO }}
      BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Capturar fuentes
        id: captura
        continue-on-error: true # aunque falle, se guarda la bitacora
        run: python -m extractores.captura_diaria

      - name: Subir datos y bitacora
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bronce calidad/bitacora-captura.csv
          if git diff --staged --quiet; then
            echo "Sin cambios que subir"
          else
            git commit -m "captura: $(date -u +%F) (${{ steps.captura.outcome }})"
            git pull --rebase
            git push
          fi

      - name: Marcar la ejecucion como fallida si una fuente obligatoria fallo
        if: steps.captura.outcome == 'failure'
        run: exit 1
